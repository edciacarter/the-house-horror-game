<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE HOUSE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>THE HOUSE</h1>

        <div id="story">
            You wake up in a dark, abandoned house.

            <br><br>

            You hear footsteps coming from upstairs.

            <br><br>

            What do you do?
        </div>

        <div id="choices">

            <button onclick="chooseA()">
                A. Go upstairs
            </button>

            <button onclick="chooseB()">
                B. Search the kitchen for a weapon
            </button>

        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
