<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>THE HOUSE</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ================================
         TITLE SCREEN
    ================================= -->

    <div
        id="titleScreen"
        class="title-screen"
    >

        <div class="title-content">

            <div class="title-warning">
                YOU SHOULD NOT BE HERE
            </div>

            <h1>THE HOUSE</h1>

            <p class="title-subtitle">
                SOME HOUSES REMEMBER.
            </p>

            <button
                id="startButton"
                class="start-button"
            >
                ENTER THE HOUSE
            </button>

            <p class="title-warning-small">
                HEADPHONES RECOMMENDED
            </p>

        </div>

    </div>


    <!-- ================================
         GAME
    ================================= -->

    <main
        id="game"
        class="game-container"
    >


        <header class="game-header">

            <h1>THE HOUSE</h1>

            <p>
                CHAPTER ONE
            </p>

        </header>


        <!-- ================================
             HUD
        ================================= -->

        <section
            id="hud"
            class="hud"
        >

            <div class="stat">

                <span>
                    HEALTH
                </span>

                <strong id="health">
                    100
                </strong>

            </div>


            <div class="stat">

                <span>
                    SANITY
                </span>

                <strong id="sanity">
                    100
                </strong>

            </div>


            <div class="stat">

                <span>
                    BATTERY
                </span>

                <strong id="battery">
                    100%
                </strong>

            </div>


            <div class="stat">

                <span>
                    CLUES
                </span>

                <strong id="clues">
                    0
                </strong>

            </div>

        </section>


        <!-- ================================
             STORY
        ================================= -->

        <section
            id="story"
            class="story"
        >

        </section>


        <!-- ================================
             CHOICES
        ================================= -->

        <section
            id="choices"
            class="choices"
        >

        </section>


        <!-- ================================
             INVENTORY
        ================================= -->

        <section
            class="inventory"
        >

            <span>
                INVENTORY
            </span>

            <div id="inventory">
                Empty
            </div>

        </section>


        <footer class="game-footer">

            <span>
                THE HOUSE
            </span>

            <span>
                CHAPTER ONE
            </span>

        </footer>


    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="game.js"></script>


</body>

</html>
