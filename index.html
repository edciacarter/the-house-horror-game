<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE HOUSE</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="game">

        <div class="chapter">
            CHAPTER ONE
        </div>

        <h1>THE HOUSE</h1>

        <!-- GAME HUD -->

        <div class="hud">

            <div class="stat">
                <span>❤️</span>
                <div>
                    <small>HEALTH</small>
                    <strong id="health">100</strong>
                </div>
            </div>

            <div class="stat">
                <span>🧠</span>
                <div>
                    <small>SANITY</small>
                    <strong id="sanity">100</strong>
                </div>
            </div>

            <div class="stat">
                <span>🔦</span>
                <div>
                    <small>FLASHLIGHT</small>
                    <strong id="battery">100%</strong>
                </div>
            </div>

            <div class="stat">
                <span>🕵🏽</span>
                <div>
                    <small>CLUES</small>
                    <strong id="clues">0</strong>
                </div>
            </div>

        </div>

        <!-- STORY -->

        <div class="story-box">

            <div id="story">
                Loading...
            </div>

        </div>

        <!-- CHOICES -->

        <div id="choices"></div>

        <!-- INVENTORY -->

        <div class="inventory">

            <div class="inventory-title">
                INVENTORY
            </div>

            <div id="inventory">
                Empty
            </div>

        </div>

    </main>

    <script src="game.js"></script>

</body>

</html>
